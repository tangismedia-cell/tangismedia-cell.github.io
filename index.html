<script>
function random(min, max) {
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const length = Math.floor(Math.random() * (max - min + 1)) + min;
 
    let result = "";
    for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
 
    return result;
}
    var url = document.location;
    var str1 = url.toString();
    var res = str1.split("#");
	var rando = random(5, 15);
    if (res.length < 2) {
        alert("Failed Redirecting. ");
    } else {
		var newurl = "";
		let att = res[1];
		if(att[0] == "3")
			newurl = "https://"+ rando +".tangismedia.com/track/" + res[1];
		else if(att[0] == "4" || att[0] == "5" || att[0] == "6" || att[0] == "7")
			newurl = "https://"+ rando +".tangismedia.com/rd#" + res[1];
		else
			newurl = "https://"+ rando +".tangismedia.com/" + res[1];
		console.log("newurl : " , newurl)
        window.location.href = newurl;
    }
</script>
